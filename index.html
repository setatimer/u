.text-\[\#7A4B00\]{

.text-\[\#7FA0BE\]{
  --tw-text-opacity: 1;
  color: rgb(127 160 190 / var(--tw-text-opacity, 1));
}

.text-\[\#9FB9D3\]{
  --tw-text-opacity: 1;
  color: rgb(159 185 211 / var(--tw-text-opacity, 1));
}

.text-\[\#C6D6E7\]{
  --tw-text-opacity: 1;
  color: rgb(198 214 231 / var(--tw-text-opacity, 1));
}

.text-\[var\(--bad\)\]{
  color: var(--bad);
}

.text-\[var\(--good\)\]{
  color: var(--good);
}

.text-\[var\(--muted\)\]{
  color: var(--muted);
}

.text-\[var\(--navy\)\]{
  color: var(--navy);
}

.text-white{
  --tw-text-opacity: 1;
  color: rgb(255 255 255 / var(--tw-text-opacity, 1));
}

.underline{
  text-decoration-line: underline;
}

.opacity-70{
  opacity: 0.7;
}

.shadow-md{
  --tw-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
  --tw-shadow-colored: 0 4px 6px -1px var(--tw-shadow-color), 0 2px 4px -2px var(--tw-shadow-color);
  box-shadow: var(--tw-ring-offset-shadow, 0 0 #0000), var(--tw-ring-shadow, 0 0 #0000), var(--tw-shadow);
}

.shadow-sm{
  --tw-shadow: 0 1px 2px 0 rgb(0 0 0 / 0.05);
  --tw-shadow-colored: 0 1px 2px 0 var(--tw-shadow-color);
  box-shadow: var(--tw-ring-offset-shadow, 0 0 #0000), var(--tw-ring-shadow, 0 0 #0000), var(--tw-shadow);
}

.filter{
  filter: var(--tw-blur) var(--tw-brightness) var(--tw-contrast) var(--tw-grayscale) var(--tw-hue-rotate) var(--tw-invert) var(--tw-saturate) var(--tw-sepia) var(--tw-drop-shadow);
}

.transition{
  transition-property: color, background-color, border-color, text-decoration-color, fill, stroke, opacity, box-shadow, transform, filter, backdrop-filter;
  transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
  transition-duration: 150ms;
}

.transition-all{
  transition-property: all;
  transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
  transition-duration: 150ms;
}

.duration-300{
  transition-duration: 300ms;
}

.\[overflow-wrap\:anywhere\]{
  overflow-wrap: anywhere;
}

:root {
  --navy: #0A2A4D;
  --navy-2: #123F6F;
  --ink: #12212F;
  --muted: #5E6F7F;
  --surface: #FFFFFF;
  --page: #EDF1F5;
  --line: #D8E0E8;
  --accent: #FFB52E;
  --good: #16794C;
  --good-bg: #E6F5EB;
  --bad: #B4232A;
  --bad-bg: #FDECEC;
  --safe-area-inset-top: 0px;
}

* {
  box-sizing: border-box;
}

html {
  background: var(--page);
}

body {
  margin: 0;
  background: var(--page);
  color: var(--ink);
  font-family: "Space Grotesk", "Trebuchet MS", "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased;
}

button {
  font: inherit;
}

.mono {
  font-family: "IBM Plex Mono", "Courier New", monospace;
}

button:focus-visible, a:focus-visible {
  outline: 3px solid var(--accent);
  outline-offset: 2px;
}

.hover\:border-\[\#8FA7BE\]:hover{
  --tw-border-opacity: 1;
  border-color: rgb(143 167 190 / var(--tw-border-opacity, 1));
}

.hover\:bg-\[\#F7F9FB\]:hover{
  --tw-bg-opacity: 1;
  background-color: rgb(247 249 251 / var(--tw-bg-opacity, 1));
}

.hover\:underline:hover{
  text-decoration-line: underline;
}

.disabled\:cursor-not-allowed:disabled{
  cursor: not-allowed;
}

.disabled\:opacity-40:disabled{
  opacity: 0.4;
}

  .sm\:text-base{

bnet Mask identify?",options:["Which part of an IPv4 address represents the network and which part represents the host","The MAC address for an IPv4 address","A domain name for an IP address","The port numbers used to share a public IP"],correct:[0],explanation:"A subnet mask identifies which part of an IPv4 address is the network part and which part is the host part."},{id:7,kind:"single",pick:1,prompt:"What is a Default Gateway?",options:["A route used when no more specific route matches","The local device that forwards traffic to destinations outside the local network","A system that translates domain names into IP addresses","A self-assigned address used when DHCP is unavailable"],correct:[1],explanation:"The default gateway is the local device that forwards traffic to destinations outside the local network."},{id:8,kind:"single",pick:1,prompt:"What does DNS do?",options:["Automatically provide IP configuration to clients","Discover the MAC address for an IPv4 address","Translate domain names into IP addresses and other records","Change IP address information as traffic passes through a device"],correct:[2],explanation:"DNS translates domain names into IP addresses and other records."},{id:9,kind:"single",pick:1,prompt:"What does DHCP do?",options:["Automatically provide IP configuration to clients","Translate domain names into IP addresses","Carry network error and diagnostic messages","Test a device’s own network protocol stack"],correct:[0],explanation:"DHCP automatically provides IP configuration to clients."},{id:10,kind:"single",pick:1,prompt:"A Windows PC cannot reach DHCP and self-assigns a 169.254.x.x IPv4 address. Which term describes this?",options:["Static IP","APIPA","Public IP","Loopback"],correct:[1],explanation:"APIPA is when Windows may self-assign a 169.254.x.x address when DHCP is unavailable."},{id:11,kind:"single",pick:1,prompt:"Which term matches this definition: “An IP address configured manually or reserved so it remains consistent”?",options:["Dynamic IP","Static IP","APIPA","Private IP"],correct:[1],explanation:"A static IP is configured manually or reserved so it remains consistent."},{id:12,kind:"single",pick:1,prompt:"Which term matches this definition: “An IP address assigned automatically, commonly by DHCP”?",options:["Static IP","Dynamic IP","Loopback","Public IP"],correct:[1],explanation:"A dynamic IP is assigned automatically, commonly by DHCP."},{id:13,kind:"single",pick:1,prompt:"What is a Private IP?",options:["A globally routable address used across the public internet","An address range intended for use inside private networks","An address used to test a device’s own protocol stack","A route used when no more specific route matches"],correct:[1],explanation:"A private IP is an address range intended for use inside private networks."},{id:14,kind:"single",pick:1,prompt:"What is a Public IP?",options:["An address range intended for use inside private networks","A self-assigned address used when DHCP is unavailable","A globally routable address used to communicate across the public internet","A link-layer hardware address"],correct:[2],explanation:"A public IP is a globally routable address used to communicate across the public internet."},{id:15,kind:"single",pick:1,prompt:"What does CIDR do?",options:["Allow subnets of different sizes within an address space","Represent network prefixes, such as /24","Discover the MAC address for an IPv4 address","Translate domain names into IP addresses"],correct:[1],explanation:"CIDR represents network prefixes, such as /24."},{id:16,kind:"single",pick:1,prompt:"What does VLSM allow?",options:["Subnets of different sizes within an address space","A device to test its own network protocol stack","Multiple devices to share a public IP by tracking ports","Automatic IP configuration for clients"],correct:[0],explanation:"VLSM allows subnets of different sizes within an address space."},{id:17,kind:"single",pick:1,prompt:"What does NAT do?",options:["Translate domain names into IP addresses","Change IP address information as traffic passes through a device","Track port numbers to share one public IP","Discover the MAC address for an IPv4 address"],correct:[1],explanation:"NAT changes IP address information as traffic passes through a device."},{id:18,kind:"single",pick:1,prompt:"What does PAT do?",options:["Let multiple private devices share a public IP by tracking port numbers","Translate domain names into IP addresses","Identify the network and host parts of an IPv4 address","Carry network error and diagnostic messages"],correct:[0],explanation:"PAT lets multiple private devices share a public IP by tracking port numbers."},{id:19,kind:"single",pick:1,prompt:"A technician pings 127.0.0.1 to test a device’s own network protocol stack. Which concept is being tested?",options:["APIPA","Loopback","Default Route","DNS"],correct:[1],explanation:"Loopback is an address used to test a device’s own protocol stack; IPv4 uses 127.0.0.1."},{id:20,kind:"single",pick:1,prompt:"What is a Default Route?",options:["The local device that forwards traffic outside the local network","The route used when no more specific route matches a destination","A smaller logical network created by dividing a larger network","An address range intended for use inside private networks"],correct:[1],explanation:"The default route is the route used when no more specific route matches a destination."},{id:21,kind:"single",pick:1,prompt:"What does ARP do?",options:["Translate domain names into IP addresses","Discover the MAC address associated with an IPv4 address on a local network","Automatically provide IP configuration to clients","Change IP address information as traffic passes through a device"],correct:[1],explanation:"ARP discovers the MAC address associated with an IPv4 address on a local network."},{id:22,kind:"single",pick:1,prompt:"What does ICMP do?",options:["Carry network error and diagnostic messages","Translate domain names into IP addresses","Discover the MAC address for an IPv4 address","Assign IP addresses automatically"],correct:[0],explanation:"ICMP carries network error and diagnostic messages."},{id:23,kind:"single",pick:1,prompt:"Which statement correctly compares IPv4 and IPv6?",options:["IPv4 is 128-bit and IPv6 is 32-bit","IPv4 is written in hexadecimal groups and IPv6 uses four decimal numbers","IPv6 is 128-bit and written in hexadecimal groups; IPv4 is 32-bit and commonly written as four decimal numbers","Both use the same bit length and the same written form"],correct:[2],explanation:"IPv6 is 128-bit and written in hexadecimal groups, while IPv4 is 32-bit and commonly written as four decimal numbers."},{id:24,kind:"single",pick:1,prompt:"A server must keep the same IP address over time so other devices can always find it. Which address type fits best?",options:["Dynamic IP","APIPA","Static IP","Loopback"],correct:[2],explanation:"A static IP is configured manually or reserved so it remains consistent."},{id:25,kind:"single",pick:1,prompt:"A network needs an address that can be reached across the public internet. Which address type fits?",options:["Private IP","Public IP","Loopback","APIPA"],correct:[1],explanation:"A public IP is globally routable and used to communicate across the public internet."},{id:26,kind:"single",pick:1,prompt:"Several private devices need to share one public IP. Which mechanism tracks port numbers to make that possible?",options:["NAT","PAT","DNS","ARP"],correct:[1],explanation:"PAT lets multiple private devices share a public IP by tracking port numbers."},{id:27,kind:"single",pick:1,prompt:"Compare Subnet Mask and CIDR. Which one represents network prefixes, such as /24?",options:["Subnet Mask","CIDR","VLSM","Subnet"],correct:[1],explanation:"CIDR represents network prefixes, such as /24. A subnet mask identifies the network and host parts of an IPv4 address."},{id:28,kind:"single",pick:1,prompt:"A device knows an IPv4 address on its local network but needs the matching hardware address. Which protocol should it use?",options:["DNS","DHCP","ARP","ICMP"],correct:[2],explanation:"ARP discovers the MAC address associated with an IPv4 address on a local network."},{id:29,kind:"single",pick:1,prompt:"Compare Default Gateway and Default Route. Which one is the local device that forwards traffic outside the local network?",options:["Default Route","Default Gateway","Subnet","Loopback"],correct:[1],explanation:"The default gateway is the local device that forwards traffic outside the local network; the default route is the route used when no more specific route matches."},{id:30,kind:"single",pick:1,prompt:"Compare MAC Address and IP Address. Which one is the link-layer hardware address assigned to a network interface?",options:["IP Address","MAC Address","Subnet Mask","Public IP"],correct:[1],explanation:"A MAC address is the link-layer hardware address assigned to a network interface; an IP address is the logical address that identifies an interface."},{id:31,kind:"multi",pick:2,prompt:"Pick 2 — Which TWO statements about IPv4 and IPv6 are correct?",options:["IPv4 is a 32-bit addressing system.","IPv6 is a 128-bit addressing system.","IPv4 is written in hexadecimal groups.","IPv6 is commonly written as four decimal numbers.","IPv6 is a 32-bit addressing system."],correct:[0,1],explanation:"IPv4 is 32-bit and IPv6 is 128-bit. Their written forms are also different: IPv4 commonly uses four decimal numbers and IPv6 uses hexadecimal groups."},{id:32,kind:"multi",pick:2,prompt:"Pick 2 — Which TWO statements about DHCP and APIPA are correct?",options:["DHCP automatically provides IP configuration to clients.","APIPA is when Windows may self-assign a 169.254.x.x address when DHCP is unavailable.","DHCP translates domain names into IP addresses.","APIPA provides a globally routable public IP.","APIPA automatically provides IP configuration to clients."],correct:[0,1],explanation:"DHCP automatically provides IP configuration, whil
